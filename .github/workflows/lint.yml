# SPDX-License-Identifier: GPL-3.0-or-later
name: Lint

# Runs first and fails fast: these checks take seconds and catch the mistakes that would
# otherwise waste a full build on three platforms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, boundaries, licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, for the submodule as well as this repository. vcpkg resolves a
          # pinned port version by checking out a tree from its own git history, and the
          # shallow clone the action makes by default does not contain those objects: the
          # failure is "failed to unpack tree object", several steps later, and reads like
          # repository corruption rather than a checkout option.
          fetch-depth: 0

      # Major 23 specifically, which is what tools/format.sh requires and what the tree is
      # formatted with. clang-format's output is not stable across majors, so a different one
      # would reformat everything and make every diff unreadable; the script refuses to run
      # rather than let that happen, which is why this installs from LLVM's own archive
      # instead of using the runner's clang-format.
      #
      # Verified to agree with the development machine's copy: apt's 23.1.2 and Homebrew's
      # 23.1.1 both report the tree clean, all 148 files.
      - name: Install clang-format 23
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
            http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-23
          sudo ln -sf "$(command -v clang-format-23)" /usr/local/bin/clang-format
          clang-format --version

      - name: Licence headers
        run: python3 tools/check_spdx.py

      - name: Module boundaries
        run: python3 tools/check_module_deps.py

      # Every workflow keys its vcpkg binary cache on vcpkg.json. This is what makes that key
      # follow the submodule as well: the gitlink and the baseline cannot disagree (M23).
      - name: vcpkg pin
        run: python3 tools/check_vcpkg_pin.py

      - name: Formatting
        env:
          CLANG_FORMAT: /usr/local/bin/clang-format
        run: ./tools/format.sh --check

      # Recompiles the shaders and compares against the committed outputs, so that a shader
      # edited without re-cooking fails here rather than rendering something stale.
      - name: Install the shader toolchain
        run: sudo apt-get install -y --no-install-recommends glslang-tools spirv-cross

      - name: Shaders are current
        run: python3 tools/cook_shaders.py --check

      # The mods written in C (ADR-0023): clang and wasm-ld of LLVM 23, from the repository the
      # formatter step above already added. The check compares the inputs and the committed
      # module on any machine, rebuilds here, and compares the rebuilt bytes only when this
      # toolchain is exactly the one the manifest records — otherwise it says so and does not.
      - name: Install the mod toolchain
        run: sudo apt-get install -y --no-install-recommends clang-23 lld-23

      - name: Mods are current
        run: |
          python3 tools/build_mods.py --mods assets/source/mods/mods.json --check
          python3 tools/build_mods.py --mods apps/chess/mods.json --check

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, for the submodule as well as this repository. vcpkg resolves a
          # pinned port version by checking out a tree from its own git history, and the
          # shallow clone the action makes by default does not contain those objects: the
          # failure is "failed to unpack tree object", several steps later, and reads like
          # repository corruption rather than a checkout option.
          fetch-depth: 0

      - name: Install toolchain
        run: bash tools/ci/linux_deps.sh

      # Version 23, from the same source as clang-format above and matching the development
      # machine's. Ubuntu's clang-tidy-19 disagreed with it often enough to be its own category
      # of failure: three lint breaks in one milestone, every one of them a check that one
      # version reports and the other does not, on code both versions compile. A linter that
      # says something different from the one the author ran is a linter nobody can keep green.
      - name: Install clang-tidy 23
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
            http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-tidy-23
          clang-tidy-23 --version

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-x64-linux-clang19-${{ hashFiles('vcpkg.json', '.gitmodules', 'external/vcpkg-overlays/**') }}
          restore-keys: vcpkg-x64-linux-clang19-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # Benchmarks on, because clang-tidy now analyses them too and can only analyse what the
      # compilation database describes. This step configures without building, which is all
      # clang-tidy needs.
      - name: Configure
        run: cmake --preset linux-clang-debug -DATLAS_BUILD_BENCHMARKS=ON

      - name: Run clang-tidy
        env:
          ATLAS_CLANG_TIDY: /usr/bin/clang-tidy-23
        run: ./tools/tidy.sh linux-clang-debug
