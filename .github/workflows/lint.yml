# SPDX-License-Identifier: GPL-3.0-or-later
name: Lint

# Runs first and fails fast: these checks take seconds and catch the mistakes that would
# otherwise waste a full build on three platforms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, boundaries, licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-19
          sudo ln -sf "$(command -v clang-format-19)" /usr/local/bin/clang-format

      - name: Licence headers
        run: python3 tools/check_spdx.py

      - name: Module boundaries
        run: python3 tools/check_module_deps.py

      - name: Formatting
        env:
          CLANG_FORMAT: /usr/local/bin/clang-format
        run: ./tools/format.sh --check

      # Recompiles the shaders and compares against the committed outputs, so that a shader
      # edited without re-cooking fails here rather than rendering something stale.
      - name: Install the shader toolchain
        run: sudo apt-get install -y --no-install-recommends glslang-tools spirv-cross

      - name: Shaders are current
        run: python3 tools/cook_shaders.py --check

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: bash tools/ci/linux_deps.sh

      - name: Install clang-tidy
        run: sudo apt-get install -y --no-install-recommends clang-tidy-19

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-x64-linux-clang19-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-x64-linux-clang19-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset linux-clang-debug

      - name: Run clang-tidy
        env:
          ATLAS_CLANG_TIDY: /usr/bin/clang-tidy-19
        run: ./tools/tidy.sh linux-clang-debug
