# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Runner labels are pinned, never "*-latest". windows-latest silently became Visual Studio
# 2026 in June 2026; a build that only works by accident of the default is not reproducible.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 Debug
            os: macos-26
            preset: macos-debug
            triplet: arm64-osx
          - name: macOS arm64 Release
            os: macos-26
            preset: macos-release
            triplet: arm64-osx
          - name: Linux x86_64 Clang Debug
            os: ubuntu-24.04
            preset: linux-clang-debug
            triplet: x64-linux
          - name: Linux x86_64 Clang Release
            os: ubuntu-24.04
            preset: linux-clang-release
            triplet: x64-linux
          - name: Windows x64 MSVC Debug
            os: windows-2025
            preset: windows-msvc-debug
            triplet: x64-windows
          - name: Windows x64 MSVC Release
            os: windows-2025
            preset: windows-msvc-release
            triplet: x64-windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, for the submodule as well as this repository. vcpkg resolves a
          # pinned port version by checking out a tree from its own git history, and the
          # shallow clone the action makes by default does not contain those objects: the
          # failure is "failed to unpack tree object", several steps later, and reads like
          # repository corruption rather than a checkout option.
          fetch-depth: 0

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: bash tools/ci/linux_deps.sh

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja is the generator every preset names, and Windows runners do not have it on
      # PATH. The Visual Studio installation bundles a copy, but where it lives moves between
      # versions, so this installs a known one rather than hunting for it.
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress --yes

      # The binary cache is what keeps this from rebuilding every dependency from source on
      # every push. Keyed on the manifest, the submodule declaration and the overlay ports, so
      # a dependency change invalidates it and nothing else does.
      #
      # It follows the pinned vcpkg commit through vcpkg.json's `builtin-baseline`, which
      # `tools/check_vcpkg_pin.py` holds equal to the submodule's gitlink. Until M23 nothing
      # did, and bumping the submodule without the baseline would have restored a cache built
      # against a different port tree with nothing to say so. The lint workflow and precheck
      # run the check; a bump that moves one record and not the other fails there first.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', '.gitmodules', 'external/vcpkg-overlays/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Benchmarks are off by default because they take far longer to run than the tests.
      # They are built here on every platform all the same: until M8 they compiled only on the
      # development machine, under one compiler, and a benchmark that does not build is a
      # performance claim nobody can reproduce.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DATLAS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Excludes the "gpu" label: hosted runners have no GPU. The "integration" tests run
      # the sandbox binary end to end, which this step used to do by hand; they are part of
      # the ordinary test run now, so a developer gets the same coverage locally.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Timings from a shared runner are noise and no threshold is asserted on them. What is
      # exercised is each benchmark's own checks: the hashing group refuses to report a number
      # for a candidate that is not deterministic, ignores part of its input, or disagrees with
      # the one-shot hash it streams. Running it on all three platforms is also what makes the
      # candidates' cross-platform agreement a fact rather than an expectation.
      - name: Benchmark self-checks
        shell: bash
        run: |
          BENCH="build/${{ matrix.preset }}/bin/atlas_bench"
          [ -x "${BENCH}" ] || BENCH="${BENCH}.exe"
          "./${BENCH}" --filter hash

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            external/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore
